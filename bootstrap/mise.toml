# This project is the AWS-host adapter. Shared tools, repositories, dotfiles,
# Pi, Herdr, and skills come from the durable ~/dotfiles checkout.

[bootstrap.packages]
# Required before the shared bootstrap can clone and run.
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
# Host-specific Docker packages. The Docker apt repository is added by the Pango setup.
"apt:containerd.io" = "latest"
"apt:docker-ce" = "latest"

[bootstrap.repos]
"~/dotfiles" = { url = "https://github.com/cx18121/dotfiles.git" }

[tasks.bootstrap]
description = "Apply shared development setup and AWS-host safeguards"
run = "./scripts/configure-user.sh"
